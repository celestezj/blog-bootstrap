name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: race
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: agent-guide consistency
        if: runner.os != 'Windows'
        run: ./scripts/check-agent-guide.sh

      - name: plan dry-run
        shell: bash
        run: |
          set -eu
          bin="$RUNNER_TEMP/blog-bootstrap"
          go build -o "$bin" ./cmd/blog-bootstrap
          cfg="$RUNNER_TEMP/blog-setup.yml"
          cat >"$cfg" <<'EOF'
          version: 1
          repos:
            source: git@github.com:celestezj/blog-delta.git
            theme: git@github.com:celestezj/hexo-theme-A4.git
            deploy: git@github.com:celestezj/celestezj.github.io.git
          git_identity:
            name: Celeste
            email: celeste@example.com
          workspace:
            dir: ./workspace
          EOF
          "$bin" plan --config "$cfg" --json >"$RUNNER_TEMP/plan.json"
          grep -q '"ok": true' "$RUNNER_TEMP/plan.json"
          grep -q '"hash":' "$RUNNER_TEMP/plan.json"
